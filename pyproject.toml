[project]
name = "hr-ai"
version = "0.1.0"
description = "Local-LLM smart search layer for the HR Advanced Search (natural language -> ISearchModel)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["model", ".venv", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "model: tests that load the real local Qwen model (slow, needs the model directory)",
    "integration: FastAPI TestClient tests with a fake LLM",
]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
